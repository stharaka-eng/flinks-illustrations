<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Flinks illustrations – preview</title>
<link rel="icon" href="data:,">
<style>
  /* Preview page only – not part of the components. */
  body { margin: 0; padding: 20px 16px 48px; background: #fff; color: #1B1B3C; font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { margin: 0 0 24px; color: #6B7088; font-size: 14px; }
  section { margin: 0 0 40px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  code { font-size: 12px; color: #6B7088; word-break: break-all; }
  .ctl { margin-top: 24px; font-size: 14px; }
  label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
</style>
</head>
<body>
<main>
  <h1>Flinks illustrations – Upload page</h1>
  <p class="note">Preview for checking the animations on desktop and mobile. Each one loops automatically and pauses when scrolled out of view.</p>

  <section><h2>1 · Upload documents</h2><flinks-upload-documents></flinks-upload-documents></section>
  <section><h2>2 · Process documents</h2><flinks-process-documents></flinks-process-documents></section>
  <section><h2>3 · Fraud verdict</h2><flinks-fraud-verdict></flinks-fraud-verdict></section>
  <section><h2>4 · Fraud dashboard</h2><flinks-fraud-dashboard></flinks-fraud-dashboard></section>
  <section><h2>5 · Fraud API</h2><flinks-fraud-api></flinks-fraud-api></section>

  <div class="ctl">
    <label><input type="checkbox" id="small"> Narrow (260px wide, simulates a small container)</label>
  </div>
</main>

<script src="upload/upload-documents/embed/flinks-upload-documents.js"></script>
<script src="upload/process-documents/embed/flinks-process-documents.js"></script>
<script src="upload/fraud-verdict/embed/flinks-fraud-verdict.js"></script>
<script src="upload/fraud-dashboard/embed/flinks-fraud-dashboard.js"></script>
<script src="upload/fraud-api/embed/flinks-fraud-api.js"></script>
<script>
  document.getElementById('small').addEventListener('change', function (e) {
    document.querySelectorAll('section > [class], section > *:not(h2)').forEach(function (el) {
      if (el.tagName.toLowerCase().indexOf('flinks-') === 0) el.style.setProperty('--flx-width', e.target.checked ? '260px' : '100%');
    });
  });
</script>
</body>
</html>
