<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Flinks illustrations – Cross-Border Payments page</title>
<link rel="icon" href="data:,">
<style>
  /* Preview page only – not part of the components. */
  body { margin: 0; padding: 20px 16px 48px; background: #fff; color: #1B1B3C; font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { margin: 0 0 24px; color: #6B7088; font-size: 14px; }
  section { margin: 0 0 40px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .ctl { margin-top: 24px; font-size: 14px; }
  label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  a.back { font-size: 14px; color: #00ACE4; text-decoration: none; }
</style>
</head>
<body>
<main>
  <a class="back" href="../">← All pages</a>
  <h1>Flinks illustrations – Cross-Border Payments page</h1>
  <p class="note">Preview for checking the animations on desktop and mobile. Each one loops automatically and pauses when scrolled out of view.</p>

  <section><h2>1 · Account ownership</h2><flinks-account-ownership></flinks-account-ownership></section>
  <section><h2>2 · Document fallback</h2><flinks-document-fallback></flinks-document-fallback></section>
  <section><h2>3 · NSF risk</h2><flinks-nsf-risk></flinks-nsf-risk></section>
  <section><h2>4 · Account funding</h2><flinks-account-funding></flinks-account-funding></section>

  <div class="ctl"><label><input type="checkbox" id="small"> Narrow (260px wide, simulates a small container)</label></div>
</main>

<script src="account-ownership/embed/flinks-account-ownership.js"></script>
<script src="document-fallback/embed/flinks-document-fallback.js"></script>
<script src="nsf-risk/embed/flinks-nsf-risk.js"></script>
<script src="account-funding/embed/flinks-account-funding.js"></script>
<script>
  document.getElementById('small').addEventListener('change', function (e) {
    document.querySelectorAll('section > *').forEach(function (el) {
      if (el.tagName.toLowerCase().indexOf('flinks-') === 0) el.style.setProperty('--flx-width', e.target.checked ? '260px' : '100%');
    });
  });
</script>
</body>
</html>
